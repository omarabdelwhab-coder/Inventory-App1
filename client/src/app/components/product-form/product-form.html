<div class="modal-backdrop-custom d-flex align-items-center justify-content-center">
  <div class="product-modal-card">

    <div class="modal-header-custom d-flex justify-content-between align-items-center mb-4">
      <h4 class="m-0 text-white font-weight-bold">
        @if (isEditMode) { Edit Product } @else { Add Product }
      </h4>
      <button type="button" class="close-btn" (click)="onCancel()">&times;</button>
    </div>
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()">

      <div class="mb-3">
        <label class="form-label text-secondary small">Product Name</label>
        <input type="text" formControlName="productName" class="form-control dark-input"
          placeholder="e.g. Wireless Keyboard" />

      </div>
      <div class="col-6">
        <label class="form-label text-secondary small">Quantity</label>
        <input type="number" formControlName="quantity" class="form-control dark-input" placeholder="0" />

      </div>
      <div class="row g-3 mb-4">
        <div class="col-6">
          <label class="form-label text-secondary small">Price ($)</label>
          <input type="number" formControlName="unitCost" class="form-control dark-input" placeholder="0" />

        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center">
        @if (isEditMode) {
          <button type="button" class="btn btn-outline-danger btn-custom" (click)="onDelete()">
            Delete
          </button>
        } @else {
          <div></div>
        }

        <div class="d-flex gap-2">
          <button type="button" class="btn btn-dark-cancel btn-custom" (click)="onCancel()">
            Cancel
          </button>
          <button type="submit" [disabled]="productForm.invalid" class="btn btn-purple btn-custom">
            @if (isEditMode) { Update Product } @else { Save Product }
          </button>
        </div>
      </div>

    </form>
  </div>
</div>
